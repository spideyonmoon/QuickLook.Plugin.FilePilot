name: build

on:
  push:
    branches: ["**"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # update-version.ps1 reads the latest tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Stamp version
        shell: pwsh
        run: ./Scripts/update-version.ps1

      - name: Build
        run: dotnet build QuickLook.Plugin.FilePilot.sln -c Release

      - name: Pack .qlplugin
        shell: pwsh
        run: ./Scripts/pack-zip.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: QuickLook.Plugin.FilePilot
          path: QuickLook.Plugin.FilePilot.qlplugin

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" QuickLook.Plugin.FilePilot.qlplugin --title "${{ github.ref_name }}" --generate-notes
